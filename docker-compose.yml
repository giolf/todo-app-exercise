services:
  db:
    image: postgres:16-alpine
    container_name: todo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: todosdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - todo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d todosdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${BACKEND_IMAGE:-giolf/todo-be-api:latest}
    pull_policy: always
    container_name: todo-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/todosdb
      DB_MAX_RETRIES: 30
      DB_RETRY_DELAY_MS: 2000
    ports:
      - "3000:3000"

volumes:
  todo-db-data:
